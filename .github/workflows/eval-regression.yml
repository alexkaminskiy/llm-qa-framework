name: LLM Eval Regression

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  # schedule:
  #   - cron: "0 6 * * *"   # nightly at 06:00 UTC
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Capture new baseline and commit it"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Capture new baseline
        if: github.event.inputs.update_baseline == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/capture_baseline.py
      
      - name: Commit updated baseline
        if: github.event.inputs.update_baseline == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baselines/baseline.json
          git diff --staged --quiet || git commit -m "chore: update eval baseline [skip ci]"
          git push

      - name: Run LLM evaluation suite
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest -v --tb=short \
            --junit-xml=reports/results.xml \
            --html=reports/report.html \
            --self-contained-html

      - name: Generate traceability matrix and TRR
        if: always()
        run: |
         pip install weasyprint
         python scripts/generate_traceability.py

      - name: Upload TRR and matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: trr-${{ github.run_id }}
         path: |
           docs/TRR.md
           docs/TRR.pdf
           reports/traceability_matrix.csv

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: reports/

      - name: Prepare pages content
        if: always()
        run: |
          mkdir -p pages
          cp reports/report.html pages/index.html
          cp docs/TRR.md pages/TRR.md
          [ -f docs/TRR.pdf ] && cp docs/TRR.pdf pages/TRR.pdf || true
          cp reports/traceability_matrix.csv pages/traceability_matrix.csv

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          destination_dir: .  # publishes to root of gh-pages branch
          keep_files: false